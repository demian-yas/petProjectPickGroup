
services:
  postgres:
    image: postgres:17
    container_name: pickgroup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pickgroup
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pickgroup_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickgroup"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pickgroup_postgres_data: